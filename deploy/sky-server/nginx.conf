# /srv/mayor2026/nginx.conf — bind-mounted into the Dokploy nginx container.
# Write it in place (cat > file) so the single-file bind mount keeps its inode, then:
#   docker exec mini-w1-mayor2026-6lzstg-web-1 nginx -t && docker exec mini-w1-mayor2026-6lzstg-web-1 nginx -s reload
server {
 listen 80; root /published/current;
 resolver 127.0.0.11 valid=30s ipv6=off;
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy strict-origin-when-cross-origin;
 location /assets/ { add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400"; try_files $uri =404; }

 # Open data API (docs/api.md). Plain requests stay static files with CORS; requests with a
 # query string (?limit=10 …) and the two virtual endpoints go to scripts/api_server.py.
 location ~ ^/(api|feeds)/.+\.json$ {
  add_header X-Content-Type-Options nosniff;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cache-Control "no-cache, must-revalidate";
  if ($args != "") { rewrite ^ /__dynamic_api last; }
  try_files $uri =404;
 }
 location = /api/posts.json { rewrite ^ /__dynamic_api last; }
 location = /api/elections/2026/candidates.json { rewrite ^ /__dynamic_api last; }
 location = /__dynamic_api {
  internal;
  set $mayor_api http://mayor2026-api:8341;
  proxy_pass $mayor_api$request_uri;
  proxy_set_header Host $host;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
 }

 location / { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri $uri/ =404; }
 error_page 404 /404.html;
 location = /404.html { internal; add_header X-Robots-Tag noindex; add_header Cache-Control no-store; }
}
